name: Generate Insights Manifest

on:
  push:
    branches: [main]
    paths:
      - 'insights/posts/**.json'
      - 'insights/insight-post.html'
      - 'assets/js/insight-render.js'
      - 'generate-manifest.js'
      - 'scripts/og-images.js'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate manifest, article pages and sitemap
        run: node generate-manifest.js

      - name: Share images for new articles
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/og-images.js --missing

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add insights/manifest.json insights/*/index.html sitemap.xml assets/images/og
          git diff --staged --quiet || git commit -m "chore: update insights manifest, article pages and sitemap"
          git push
