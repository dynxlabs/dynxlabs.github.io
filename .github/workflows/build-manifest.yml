name: Generate Insights Manifest

on:
  push:
    branches: [main]
    paths:
      - 'insights/posts/**.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate manifest
        run: node generate-manifest.js

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add insights/manifest.json
          git diff --staged --quiet || git commit -m "chore: update insights manifest"
          git push
