<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script>
    // Redirect /insights/[slug] → /insights/insight-post.html
    var slug = window.location.pathname.split('/').filter(Boolean).pop();
    if (slug && slug !== 'insights') {
      sessionStorage.setItem('dynx_redirect_slug', slug);
      window.location.replace('/insights/insight-post.html');
    } else {
      window.location.replace('/insights');
    }
  </script>
</head>
<body></body>
</html>
